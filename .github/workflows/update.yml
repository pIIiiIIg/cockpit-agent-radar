name: radar-update

on:
  schedule:
    # UTC 01/06/11 点 = 北京时间 9:00 / 14:00 / 19:00（Actions cron 只认 UTC）
    - cron: '0 1,6,11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: fetch + test + build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 提高 search API 限额
        run: |
          python scripts/fetch_rank.py
          python scripts/backfill_abstract_explanations.py
          python scripts/test_explanations.py
          python scripts/test_automation_pages.py
          python scripts/build_site.py
      - name: commit & push
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "radar: $(date -u '+%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3 4; do
            git push && exit 0
            git fetch origin main
            if ! GIT_EDITOR=true git rebase origin/main; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              nongenerated="$(printf '%s\n' "$conflicts" | grep -v '^docs/' || true)"
              if [ -n "$nongenerated" ]; then
                echo "Non-generated rebase conflicts:" >&2
                printf '%s\n' "$nongenerated" >&2
                exit 1
              fi
              python scripts/build_site.py
              git add docs
              GIT_EDITOR=true git rebase --continue
            fi
            sleep $((attempt * 10))
          done
          echo "Push failed after retries" >&2
          exit 1
